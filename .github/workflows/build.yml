name: 🛠️ Builds
# 同一提交若既 push 到分支、又属于某 PR，会在 push 与 pull_request 上各跑一次。
# 因此 push 只针对 master（合并后验证），开发分支由 pull_request 触发，避免重复。
on:
    push:
        branches: [master]
    pull_request:
    merge_group:

concurrency:
    group: ${{ github.workflow }}|${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest
        name: 🧪 C++ unit tests
        steps:
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"

            - name: Set up SCons
              shell: bash
              run: |
                  python -c "import sys; print(sys.version)"
                  python -m pip install scons==4.4
                  scons --version

            - name: Checkout project
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: (Linux) Install dependencies
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -qqq build-essential pkg-config

            - name: Compile extension with tests
              shell: sh
              env:
                  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
                  SCONS_CACHE_LIMIT: 7168
              run: |
                  scons target=template_debug platform=linux arch=x86_64 debug_symbols=no tests=yes

            - name: Fetch Godot
              shell: bash
              env:
                  GODOT_VERSION: 4.3-stable
                  GODOT_ASSET: Godot_v4.3-stable_linux.x86_64.zip
              run: |
                  set -euo pipefail
                  mkdir -p tests-bin
                  URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_ASSET}"
                  echo "Downloading $URL"
                  curl -fL --retry 3 --retry-delay 2 -o godot.zip "$URL"
                  unzip -o godot.zip -d tests-bin/
                  chmod +x tests-bin/Godot* 2>/dev/null || true
                  GODOT_BIN="$(find tests-bin -maxdepth 1 -name 'Godot*' -type f | head -1)"
                  test -n "$GODOT_BIN"
                  echo "GODOT=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"
                  echo "Using GODOT=$GITHUB_WORKSPACE/$GODOT_BIN"

            - name: Import project assets
              shell: bash
              run: |
                  "$GODOT" --headless --path demo --import
                  test -f demo/.godot/extension_list.cfg
                  grep -q "godot_dragon_bones" demo/.godot/extension_list.cfg

            - name: Run C++ unit tests
              shell: bash
              timeout-minutes: 1
              run: |
                  set -o pipefail
                  "$GODOT" --headless --path demo --gddb-run-tests 2>&1 | tee tests-output.log
                  # 经 tee 后需显式取回管道首命令的退出码。
                  rc=${PIPESTATUS[0]}
                  # 断言确实跑到了用例（防止入口未触发却以 0 退出的假绿）。
                  grep -q "\[doctest\] Status: SUCCESS!" tests-output.log
                  exit "$rc"

            - name: Check for exit-time resource leaks and crashes
              shell: bash
              timeout-minutes: 3
              run: |
                  "$GODOT" --headless --path demo -- --auto-exit 2>&1 | tee exit-check.log
                  if grep -nE "ERROR:|CrashHandlerException|Program crashed|signal [0-9]+" exit-check.log; then
                      echo "::error::退出期存在资源泄露或异常崩溃，详见上方日志"
                      exit 1
                  fi

    build:
        runs-on: ${{ matrix.runner }}
        name: ${{ matrix.name }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - identifier: linux-x64-debug
                      name: 🐧 Linux x64 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: yes
                      platform: linux
                      arch: x86_64
                    - identifier: linux-x64-release
                      name: 🐧Linux x64 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: linux
                      arch: x86_64
                    - identifier: linux-x86-debug
                      name: 🐧 Linux x86 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: no # 库太大了
                      platform: linux
                      arch: x86_32
                    - identifier: linux-x86-release
                      name: 🐧Linux x86 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: linux
                      arch: x86_32
                    - identifier: macos-universal-debug
                      name: 🍎 macOS (universal) Debug
                      runner: macos-latest
                      target: template_debug
                      debug_symbols: yes
                      platform: macos
                      arch: universal
                    - identifier: macos-universal-release
                      name: 🍎 macOS (universal) Release
                      runner: macos-latest
                      target: template_release
                      debug_symbols: no
                      platform: macos
                      arch: universal
                    - identifier: ios-arm64-debug
                      name: 🍏 ios arm64 Debug
                      runner: macos-latest
                      target: template_debug
                      debug_symbols: no # 库太大了
                      platform: ios
                      arch: arm64
                    - identifier: ios-arm64-release
                      name: 🍏 ios arm64 Release
                      runner: macos-latest
                      target: template_release
                      debug_symbols: no
                      platform: ios
                      arch: arm64
                    - identifier: windows-x64-debug
                      name: 🏁 Windows x64 Debug
                      runner: windows-latest
                      target: template_debug
                      debug_symbols: yes
                      platform: windows
                      arch: x86_64
                    - identifier: windows-x64-release
                      name: 🏁 Windows x64 Release
                      runner: windows-latest
                      target: template_release
                      debug_symbols: no
                      platform: windows
                      arch: x86_64
                    - identifier: windows-x86-debug
                      name: 🏁 Windows x86 Debug
                      runner: windows-latest
                      target: template_debug
                      debug_symbols: no # 库太大了
                      platform: windows
                      arch: x86_32
                    - identifier: windows-x86-release
                      name: 🏁 Windows x86 Release
                      runner: windows-latest
                      target: template_release
                      debug_symbols: no
                      platform: windows
                      arch: x86_32
                    - identifier: android-arm64-debug
                      name: 🤖 Android arm64 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: yes
                      platform: android
                      arch: arm64
                    - identifier: android-arm64-release
                      name: 🤖 Android arm64 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: android
                      arch: arm64
                    - identifier: android-x86_64-debug
                      name: 🤖 Android x86_64 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: no  # 库太大了
                      platform: android
                      arch: x86_64
                    - identifier: android-x86_64-release
                      name: 🤖 Android x86_64 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: android
                      arch: x86_64
                    - identifier: android-arm32-debug
                      name: 🤖 Android arm32 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: no  # 库太大了
                      platform: android
                      arch: arm32
                    - identifier: android-arm32-release
                      name: 🤖 Android arm32 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: android
                      arch: arm32
                    - identifier: android-x86_32-debug
                      name: 🤖 Android x86_32 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: no # 库太大了
                      platform: android
                      arch: x86_32
                    - identifier: android-x86_32-release
                      name: 🤖 Android x86_32 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: android
                      arch: x86_32
                    - identifier: web-wasm32-debug
                      name: 🌐 Web wasm32 Debug
                      runner: ubuntu-latest
                      target: template_debug
                      debug_symbols: yes
                      platform: web
                      arch: wasm32
                    - identifier: web-wasm32-release
                      name: 🌐 Web wasm32 Release
                      runner: ubuntu-latest
                      target: template_release
                      debug_symbols: no
                      platform: web
                      arch: wasm32

        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
          EM_VERSION: 3.1.39
          EM_CACHE_FOLDER: "emsdk-cache"

        steps:
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.x"

            - name: Set up SCons
              shell: bash
              run: |
                  python -c "import sys; print(sys.version)"
                  python -m pip install scons==4.4
                  scons --version

            - name: Checkout project
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: (Windows) Install mingw64
              if: ${{ matrix.platform == 'windows' }}
              uses: egor-tensin/setup-mingw@v3

            - name: (Linux) Install dependencies
              if: ${{ matrix.platform == 'linux' }}
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -qqq build-essential pkg-config

            - name: (Linux32) Install dependencies
              if: ${{ matrix.platform == 'linux' && matrix.arch == 'x86_32' }}
              run: |
                  sudo apt-get install gcc-multilib g++-multilib

            - name: (Android) Install dependencies
              if: ${{ matrix.platform == 'android' }}
              uses: nttld/setup-ndk@v1
              with:
                # Must match godot-cpp's default `ndk_version`
                # (thirdparty/godot-cpp/tools/android.py). It was 23.2.8568313 on the
                # godot-cpp 4.3 branch and is 28.1.13356709 on 10.x, so r23c no longer
                # resolves and every Android job fails with
                # "Could not find NDK toolchain ... Make sure NDK version ... is installed".
                ndk-version: r28b
                link-to-sdk: true

            - name: (Web) Install dependencies
              if: ${{ matrix.platform == 'web' }}
              uses: emscripten-core/setup-emsdk@v16
              with:
                version: ${{env.EM_VERSION}}
                actions-cache-folder: ${{env.EM_CACHE_FOLDER}}

            # - name: Setup build cache
            #   uses: actions/cache@v6
            #   with:
            #       path: ${{ github.workspace }}/.scons-cache/
            #       key: ${{ matrix.identifier }}
            #       #   key: ${{ matrix.identifier }}-${{ github.ref }}
            #       restore-keys: |
            #           #   ${{ matrix.identifier }}-${{ github.ref }}
            #             ${{ matrix.identifier }}
            #   continue-on-error: true

            - name: (Other) Compile extension 
              if: ${{ matrix.platform != 'ios' }}
              shell: sh
              env:
                  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
                  SCONS_CACHE_LIMIT: 7168
              run: |
                  scons target='${{ matrix.target }}' platform='${{ matrix.platform }}' arch='${{ matrix.arch }}' debug_symbols=${{ matrix.debug_symbols }}

            - name: (IOS) Compile extension
              if: ${{ matrix.platform == 'ios' }}
              shell: sh
              env:
                  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
                  SCONS_CACHE_LIMIT: 7168
              run: |
                  scons arch=universal ios_simulator=yes platform=ios target=${{ matrix.target }} debug_symbols=${{ matrix.debug_symbols }}
                  scons arch=arm64 ios_simulator=no platform=ios target=${{ matrix.target }} debug_symbols=${{ matrix.debug_symbols }}

            - name: Generate xcframework for IOS
              if: ${{ matrix.platform == 'ios' }}
              shell: sh
              env:
                  SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
                  SCONS_CACHE_LIMIT: 7168
              run: |
                  chmod +x ./generate_xcframework.sh
                  ./generate_xcframework.sh ${{ matrix.target }} debug_symbols=${{ matrix.debug_symbols }}

            - name: Copy to artifacts directory
              shell: bash
              run: |
                  python ./misc/copy_dir.py ./demo/addons ./artifact/addons/

            - name: Upload artifact ${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
                  path: |
                      ./artifact/
                  retention-days: 14

    merge_artifacts:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout project
              uses: actions/checkout@v7
              with:
                  submodules: false

            - name: Setup version
              run: |
                echo BUILD_VERSION=$(head -n 1 ./version) >> $GITHUB_ENV

            - name: Merge Artifacts to all in one
              uses: actions/upload-artifact/merge@v7
              with:
                  name: ${{ github.event.repository.name }}-all-platforms-${{ env.BUILD_VERSION }}-${{ github.sha }}
                  pattern: ${{ github.event.repository.name }}-${{ github.sha }}*
                  delete-merged: true
                  retention-days: 90